<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasons</title>
    <style>
body {
    margin: 30px;
    background-color: #f5f5f5;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
}

h1 {
    font-size: 20px;
    margin-bottom: 24px;
}

.seasons h1 {
    font-family: Georgia, serif;
}

.seasons ul {
    list-style-type: none;
    padding-left: 40px;
}

.seasons > ul > li::marker {
    content: "›  ";
    color: #555;
    font-weight: bold;
}

.winter li::marker { content: "❄️  "; }
.spring li::marker { content: "🌷  "; }
.summer li::marker { content: "🍉  "; }
.autumn li::marker { content: "🍁  "; }

.contents ol {
    margin-top: 0;
    margin-bottom: 0;
    padding-left: 40px;
}

.contents > ol {
    list-style-type: upper-roman;
}

.contents ol ol {
    list-style-type: decimal;
}

.contents ol ol ol {
    list-style-type: lower-alpha;
}

.contents li {
    color: #6464a5;
}

.contents li::marker {
    color: black;
    font-weight: bold;
}

.definitions dl {
    margin: 0;
}

.definitions dt {
    background-color: #104c51;
    color: white;
    padding: 10px 45px;
    text-transform: uppercase;
}

.definitions dd {
    background-color: #286269;
    color: #e8f1f2;
    margin: 0 0 20px;
    padding: 12px 24px;
    text-align: justify;
}

.definitions a {
    color: #eab6b6;
    text-decoration: none;
}

.footnotes {
    margin-top: 28px;
    font-family: "Times New Roman", serif;
    font-size: 12px;
    text-align: justify;
}
    </style>
</head>
<body class="seasons">
    <h1>Seasons</h1>
    <ul>
        <li>Winter
            <ul class="winter">
                <li>December</li>
                <li>January</li>
                <li>February</li>
            </ul>
        </li>
        <li>Spring
            <ul class="spring">
                <li>March</li>
                <li>April</li>
                <li>May</li>
            </ul>
        </li>
        <li>Summer
            <ul class="summer">
                <li>June</li>
                <li>July</li>
                <li>August</li>
            </ul>
        </li>
        <li>Autumn
            <ul class="autumn">
                <li>September</li>
                <li>October</li>
                <li>November</li>
            </ul>
        </li>
    </ul>
</body>
</html>
